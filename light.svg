  <text x="510" y="119" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="34" font-weight="700">Ajay Prajapati</text>
  <text x="510" y="150" fill="#0891B2" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="17">AI/ML Engineer · Full-Stack Developer</text>

  <line x1="510" y1="174" x2="1120" y2="174" stroke="#CBD5E1" stroke-opacity=".65"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">
   <text x="510" y="202" fill="#0E7490">&gt; FOCUS</text>
   <text x="630" y="202" fill="#0F172A">Machine Learning · AI Applications · Full-Stack Development · DSA</text>
   <text x="510" y="230" fill="#0E7490">&gt; ROLE</text>
   <text x="630" y="230" fill="#0F172A">AI/ML Engineer · Full-Stack Developer</text>
   <text x="510" y="258" fill="#0E7490">&gt; DSA</text>
   <text x="630" y="258" fill="#0F172A">Java · C++</text>
  </g>

  <text x="510" y="296" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2">SELECTED STACK</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10">
