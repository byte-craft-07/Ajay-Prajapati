<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
 role="img" aria-label="Ajay Prajapati — AI/ML Engineer · Full-Stack Developer. Premium terminal-style developer profile banner."
 preserveAspectRatio="xMidYMid meet">
 <defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#F8FAFC"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/>
   <animate attributeName="x2" values="1;0.85;1" dur="14s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" x2="1">
   <stop stop-color="#6366F1"/><stop offset=".5" stop-color="#0891B2"/><stop offset="1" stop-color="#10B981"/>
   <animate attributeName="x1" values="0;0.25;0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow">
   <stop stop-color="#0891B2" stop-opacity=".18"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
   <feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".18"/>
  </filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
   <path d="M24 0H0V24" fill="none" stroke="#CBD5E1" stroke-opacity=".16" stroke-width="1"/>
  </pattern>
  <clipPath id="leftClip"><rect x="28" y="28" width="430" height="554" rx="22"/></clipPath>
 </defs>

 <rect x="4" y="4" width="1172" height="602" rx="24" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.2"/>
 <rect x="5" y="5" width="1170" height="600" rx="23" fill="url(#grid)" opacity=".42"/>
 <circle cx="110" cy="90" r="210" fill="url(#glow)"/>
 <circle cx="1080" cy="520" r="240" fill="url(#glow)" opacity=".55"/>

 <!-- LEFT VISUAL.MAP -->
 <g clip-path="url(#leftClip)">
  <rect x="28" y="28" width="430" height="554" rx="22" fill="#FFFFFF" fill-opacity=".62" stroke="#CBD5E1" stroke-opacity=".75"/>
  <rect x="28" y="28" width="430" height="52" fill="#F1F5F9" fill-opacity=".78"/>
  <circle cx="53" cy="54" r="6" fill="#EF4444"/>
  <circle cx="73" cy="54" r="6" fill="#F59E0B"/>
  <circle cx="93" cy="54" r="6" fill="#10B981"/>
  <text x="118" y="59" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">developer@profile</text>
  <text x="390" y="59" fill="#10B981" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">ONLINE</text>

  <text x="58" y="108" fill="#0E7490" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2">VISUAL.MAP</text>
  <line x1="58" y1="120" x2="428" y2="120" stroke="url(#accent)" stroke-opacity=".55"/>

