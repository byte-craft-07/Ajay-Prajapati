   <text x="243" y="332">····+%@@@@@@%+····</text>
   <text x="243" y="340">···*%@@@@@@@@%*···</text>
   <text x="243" y="348">··*%@@@@@@@@@@%*··</text>
   <text x="243" y="356">·*%@@%*····*%@@%*·</text>
   <text x="243" y="364">#@@@%*······*%@@@#</text>
   <text x="243" y="372">%@@@%········%@@@%</text>
   <text x="243" y="380">#@@@%*······*%@@@#</text>
   <text x="243" y="388">·*%@@@%*··*%@@@%*·</text>
   <text x="243" y="396">··*%@@@@%%@@@@%*··</text>
   <text x="243" y="404">···#%@@@@@@@@%#···</text>
   <text x="243" y="412">····*%@@@@@@%*····</text>
   <text x="243" y="420">·····#%@@@@%#·····</text>
   <text x="243" y="428">······*%@@%*······</text>
   <text x="243" y="436">·······#%%#·······</text>
   <animate attributeName="opacity" values=".25;.9;.72;.9" dur="7s" repeatCount="indefinite"/>
  </g>
  <g stroke="#0891B2" opacity=".16">
   <line x1="48" y1="215" x2="438" y2="215"><animate attributeName="y1" values="150;430;150" dur="11s" repeatCount="indefinite"/><animate attributeName="y2" values="150;430;150" dur="11s" repeatCount="indefinite"/></line>
  </g>

  <text x="58" y="480" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">~/profile $ build --ship</text>
  <text x="58" y="507" fill="#0F172A" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13">
   <tspan fill="#0891B2">[PROFILE]</tspan> technical identity / selected work
  </text>
  <rect x="58" y="528" width="12" height="2" fill="#0891B2">
   <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
 </g>

 <!-- RIGHT SYSTEM.INFO -->
 <g>
  <rect x="478" y="28" width="674" height="554" rx="22" fill="#FFFFFF" fill-opacity=".70" stroke="#CBD5E1" stroke-opacity=".75" url(#shadow)/>
  <rect x="478" y="28" width="674" height="52" rx="22" fill="#F1F5F9" fill-opacity=".72"/>
  <text x="510" y="59" fill="#0E7490" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" letter-spacing="2">SYSTEM.INFO</text>
